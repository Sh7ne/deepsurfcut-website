<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Device bezel options | DeepSurfCut</title>
    <link rel="stylesheet" href="/device-preview/styles.css?v=3" />
  </head>
  <body>
    <header>
      <div>
        <h1>DeepSurfCut device bezel options</h1>
        <p>Apple official Product Bezels</p>
      </div>
      <div class="mode-switch" role="group" aria-label="Preview screen">
        <button type="button" data-mode="timeline" aria-pressed="true">Timeline</button>
        <button type="button" data-mode="export" aria-pressed="false">Export</button>
      </div>
    </header>

    <main>
      <div class="options">
        <figure>
          <figcaption>
            <span class="swatch" style="--swatch: #121316"></span>
            <span>
              <span class="model">iPhone Air</span>
              <span class="finish">Space Black</span>
            </span>
          </figcaption>
          <img
            src="/assets/device-options/timeline-iphone-air-space-black.png?v=device-options-3"
            data-timeline="/assets/device-options/timeline-iphone-air-space-black.png?v=device-options-3"
            data-export="/assets/device-options/export-iphone-air-space-black.png?v=device-options-3"
            data-label="iPhone Air Space Black"
            alt="DeepSurfCut timeline in iPhone Air Space Black"
          />
        </figure>

        <figure>
          <figcaption>
            <span class="swatch" style="--swatch: #35466c"></span>
            <span>
              <span class="model">iPhone 17 Pro Max</span>
              <span class="finish">Deep Blue</span>
            </span>
          </figcaption>
          <img
            src="/assets/device-options/timeline-iphone17-pro-max-deep-blue.png?v=device-options-3"
            data-timeline="/assets/device-options/timeline-iphone17-pro-max-deep-blue.png?v=device-options-3"
            data-export="/assets/device-options/export-iphone17-pro-max-deep-blue.png?v=device-options-3"
            data-label="iPhone 17 Pro Max Deep Blue"
            alt="DeepSurfCut timeline in iPhone 17 Pro Max Deep Blue"
          />
        </figure>

        <figure>
          <figcaption>
            <span class="swatch" style="--swatch: #f06422"></span>
            <span>
              <span class="model">iPhone 17 Pro Max</span>
              <span class="finish">Cosmic Orange</span>
            </span>
          </figcaption>
          <img
            src="/assets/device-options/timeline-iphone17-pro-max-cosmic-orange.png?v=device-options-3"
            data-timeline="/assets/device-options/timeline-iphone17-pro-max-cosmic-orange.png?v=device-options-3"
            data-export="/assets/device-options/export-iphone17-pro-max-cosmic-orange.png?v=device-options-3"
            data-label="iPhone 17 Pro Max Cosmic Orange"
            alt="DeepSurfCut timeline in iPhone 17 Pro Max Cosmic Orange"
          />
        </figure>
      </div>
    </main>

    <script src="/device-preview/preview.js?v=3"></script>
  </body>
</html>
