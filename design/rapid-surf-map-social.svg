<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Rapid Surf Map</title>
  <desc id="description">Deep-water standing-wave venues. An abstract blue map grid and a wave-shaped location marker, by DeepSurfCut.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f9fcff"/>
      <stop offset="1" stop-color="#e9f3ff"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0.8" y2="1">
      <stop stop-color="#1788ff"/>
      <stop offset="1" stop-color="#005bdb"/>
    </linearGradient>
    <linearGradient id="grid-fade" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="white" stop-opacity="0"/>
      <stop offset="0.42" stop-color="white" stop-opacity="0.8"/>
      <stop offset="1" stop-color="white"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(-12 930 270)">
      <path d="M48 0H0V48" fill="none" stroke="#b6d5f6" stroke-width="1"/>
    </pattern>
    <mask id="map-area"><rect x="620" width="580" height="478" fill="url(#grid-fade)"/></mask>
    <filter id="pin-shadow" x="-40%" y="-25%" width="180%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0757af" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#paper)"/>
  <g mask="url(#map-area)">
    <rect x="620" width="580" height="478" fill="url(#grid)"/>
    <circle cx="928" cy="260" r="176" fill="none" stroke="#bedbfa" stroke-width="1.5"/>
    <circle cx="928" cy="260" r="226" fill="none" stroke="#cfe4fb" stroke-width="1.5"/>
    <path d="M690 389 765 333 823 352M1037 126 1102 164 1154 151" fill="none" stroke="#83b9f0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="765" cy="333" r="5" fill="#8abdf1"/>
    <circle cx="1102" cy="164" r="5" fill="#8abdf1"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#102c4d">
    <rect x="80" y="108" width="36" height="4" rx="2" fill="#0878f0"/>
    <text x="130" y="117" font-size="17" font-weight="700" letter-spacing="2.2" fill="#35658f">RAPID SURFING DIRECTORY</text>
    <text x="76" y="262" font-size="78" font-weight="700" letter-spacing="-3.5">Rapid Surf Map</text>
    <text x="81" y="324" font-size="29" letter-spacing="-0.4" fill="#3d607f">Deep-water standing-wave venues</text>
  </g>

  <ellipse cx="928" cy="442" rx="70" ry="8" fill="#1769bd" opacity="0.08"/>
  <path d="M928 126C863 126 811 178 811 243c0 75 117 187 117 187s117-112 117-187c0-65-52-117-117-117Z" fill="url(#pin)" filter="url(#pin-shadow)"/>
  <path d="M858 271c21-49 42-70 70-56 21 7 21 35 7 42 28-7 49 7 63 28M858 306c21-14 35-14 56 0s35 14 56 0 28-7 28-7" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M80 486H1120" stroke="#c7daec" stroke-width="1"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#375775">
    <text x="80" y="540">Find venues</text>
    <circle cx="218" cy="532" r="2.5" fill="#8ca9c3"/>
    <text x="239" y="540">Check sources</text>
    <circle cx="409" cy="532" r="2.5" fill="#8ca9c3"/>
    <text x="430" y="540">Get directions</text>
    <text x="1120" y="540" text-anchor="end" fill="#102c4d">by <tspan font-weight="700">DeepSurfCut</tspan></text>
  </g>
</svg>
